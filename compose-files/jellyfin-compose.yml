name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    #ports:
    #  - "8920:8920"
    #  - "8096:8096"
    volumes:
      - ${JELLYFIN_MEDIA_FOLDER:-/mnt/jellyfinmedia}:/jellyfinmedia
      - ${SERVER_DATA_FOLDER:-/root/labdata}/jellyfin/cache:/cache
      - ${SERVER_DATA_FOLDER:-/root/labdata}/jellyfin/config:/config
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    networks:
      - app-net

networks:
  app-net:
    name: ${NETWORK_NAME:-jellyfin-bridge}
